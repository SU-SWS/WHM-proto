name: Record Site Target Score

# The Siteimprove API keeps no history for the Site Target Score, so this
# saves it once a day to data/history/ (decisions.md, Nov 19).
on:
  schedule:
    - cron: "17 14 * * *" # daily, about 6:17 a.m. Pacific
  workflow_dispatch:
    inputs:
      save_fixtures:
        description: "Also save the raw API responses for review (download from this run's Artifacts; not committed)"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with any other workflow that commits data, so pushes don't collide.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and record the score
        env:
          SITEIMPROVE_API_USER: ${{ secrets.SITEIMPROVE_API_USER }}
          SITEIMPROVE_API_KEY: ${{ secrets.SITEIMPROVE_API_KEY }}
        run: |
          if [ "${{ inputs.save_fixtures }}" = "true" ]; then
            node scripts/record-site-target.mjs --fixtures "$RUNNER_TEMP/fixtures"
          else
            node scripts/record-site-target.mjs
          fi

      - name: Upload fixtures for review
        if: ${{ inputs.save_fixtures }}
        uses: actions/upload-artifact@v4
        with:
          name: siteimprove-fixtures
          path: ${{ runner.temp }}/fixtures
          retention-days: 3

      - name: Commit history
        run: |
          git add data/history
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Site Target Score for $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
