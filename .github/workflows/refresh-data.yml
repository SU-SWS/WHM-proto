name: Data run

# "Start data run" on the admin page opens this workflow (Option A). It
# refreshes data/published/, commits it, then builds and deploys in this same
# workflow, because commits made with the default token don't trigger the
# deploy workflow.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site to refresh"
        type: choice
        default: all
        # Keep in step with data/registry.json. scripts/refresh.mjs rejects unknown keys.
        options:
          - all
          - sitesuserguide
          - webservices
          - decanter
      publish:
        description: "Publish the result (untick to review it first: the files are saved under this run's Artifacts and nothing is committed or deployed)"
        type: boolean
        default: true
  schedule:
    - cron: "0 13 * * 1" # Mondays, about 5 a.m. Pacific

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the deploy workflow's group, so two deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh data
        env:
          SITEIMPROVE_API_USER: ${{ secrets.SITEIMPROVE_API_USER }}
          SITEIMPROVE_API_KEY: ${{ secrets.SITEIMPROVE_API_KEY }}
        run: node scripts/refresh.mjs --site "${{ inputs.site || 'all' }}"

      - name: Save the result for review
        if: ${{ inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: data-run-preview
          path: data/published
          retention-days: 3

      - name: Commit published data
        if: ${{ inputs.publish != false }}
        run: |
          git add data/published
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Data run ${{ github.run_id }}: ${{ inputs.site || 'all' }}"
            git pull --rebase
            git push
          fi

      - run: npm ci
        if: ${{ inputs.publish != false }}
      - run: npx next build
        if: ${{ inputs.publish != false }}
      - uses: actions/configure-pages@v5
        if: ${{ inputs.publish != false }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publish != false }}
        with:
          path: out

  deploy:
    needs: refresh
    # The schedule has no inputs, so a scheduled run always publishes.
    if: ${{ inputs.publish != false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
